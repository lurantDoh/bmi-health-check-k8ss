<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Create account — BMI Health Check</title>
  <link rel="icon" type="image/jpeg" href="/static/nextgenmark.jpg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Sora:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <div class="atmosphere" aria-hidden="true"></div>
  <main class="shell shell--narrow">
    <header class="brand-block">
      <img class="logo" src="/static/nextgenlogo.jpg" alt="ExcelCloud — Cloud Engineering, Software, Consulting" width="968" height="272" />
      <p class="brand">Create your account</p>
      <p class="lede">Register to track your BMI and get health advice and exercise plans that fit your range.</p>
    </header>

    <form class="intake" method="post" action="/signup">
      {% if error %}
        <p class="form-error">{{ error }}</p>
      {% endif %}

      <label>
        <span>Full name</span>
        <input type="text" name="full_name" value="{{ full_name or '' }}" autocomplete="name" required />
      </label>
      <label>
        <span>Email</span>
        <input type="email" name="email" value="{{ email or '' }}" autocomplete="email" required />
      </label>
      <div class="fields">
        <label>
          <span>Password</span>
          <input type="password" name="password" autocomplete="new-password" minlength="8" required />
        </label>
        <label>
          <span>Confirm password</span>
          <input type="password" name="confirm_password" autocomplete="new-password" minlength="8" required />
        </label>
      </div>
      <p class="field-hint">At least 8 characters.</p>

      <button type="submit" class="cta">Create account</button>
      <p class="form-switch">Already registered? <a href="/signin">Sign in</a></p>
    </form>

    <footer class="site-footer">
      <img class="footer-mark" src="/static/nextgenmark.jpg" alt="" width="256" height="256" />
      <span>An <strong>ExcelCloud</strong> application</span>
    </footer>
  </main>
</body>
</html>
