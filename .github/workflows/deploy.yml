name: Build and Deploy to EKS

on:
  # Validates every PR: tests, build, and Trivy scan, but no push or deploy.
  pull_request:
    branches: [main]
  # Merging a PR lands a push on main, which runs the full pipeline.
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      expose_public:
        description: 'Expose the UI on the public NLB'
        type: boolean
        default: true

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-eks-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: us-east-2
  EKS_CLUSTER: etechapp-eks-0wtokh
  ECR_REPOSITORY: bmi-health-check-api
  K8S_NAMESPACE: bmi-api
  DEPLOYMENT: bmi-api
  DB_STATEFULSET: bmi-db
  DASHBOARD_NAME: bmi-health-check

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt -r requirements-dev.txt
      - name: Run tests
        run: PYTHONPATH=. pytest -q

  build-scan-push:
    name: Build, scan, and push image
    needs: test
    runs-on: ubuntu-latest
    outputs:
      image_ref: ${{ steps.digest.outputs.image_ref }}
    env:
      IMAGE_TAG: ${{ github.sha }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_IAM_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image metadata
        id: meta
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          echo "IMAGE_URI=${REGISTRY}/${ECR_REPOSITORY}" >> "$GITHUB_ENV"
          echo "image=${REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: ${{ steps.meta.outputs.image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image with Trivy
        id: trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.meta.outputs.image }}
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Notify Slack — scan passed
        if: success() && env.SLACK_WEBHOOK_URL != ''
        run: ./.github/scripts/slack-notify.sh pass
        env:
          IMAGE_TAG: ${{ env.IMAGE_TAG }}

      - name: Notify Slack — scan failed
        if: failure() && env.SLACK_WEBHOOK_URL != ''
        run: ./.github/scripts/slack-notify.sh fail
        env:
          IMAGE_TAG: ${{ env.IMAGE_TAG }}

      - name: Upload Trivy SARIF (informational)
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        continue-on-error: true
        with:
          image-ref: ${{ steps.meta.outputs.image }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH,MEDIUM
          ignore-unfixed: true

      # Kept as an artifact rather than uploaded to code scanning, which
      # needs Advanced Security on private repos.
      - name: Archive Trivy report
        if: always() && hashFiles('trivy-results.sarif') != ''
        uses: actions/upload-artifact@v4
        with:
          name: trivy-results
          path: trivy-results.sarif
          retention-days: 14

      # Pull requests stop here: the image is proven but never published.
      - name: Push image to ECR
        if: github.event_name != 'pull_request'
        run: docker push "${IMAGE_URI}:${IMAGE_TAG}"

      - name: Resolve image digest
        id: digest
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          DIGEST=$(aws ecr describe-images \
            --repository-name "$ECR_REPOSITORY" \
            --image-ids imageTag="$IMAGE_TAG" \
            --query 'imageDetails[0].imageDigest' --output text)
          echo "image_ref=${IMAGE_URI}@${DIGEST}" >> "$GITHUB_OUTPUT"
          echo "Pushed ${IMAGE_URI}:${IMAGE_TAG} (${DIGEST})"

  deploy:
    name: Deploy to EKS
    needs: build-scan-push
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      IMAGE_REF: ${{ needs.build-scan-push.outputs.image_ref }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      # Default to the public NLB overlay; manual runs can opt out.
      EXPOSE_PUBLIC: ${{ github.event_name == 'workflow_dispatch' && inputs.expose_public || 'true' }}
      # Unique per run, and on a reserved TLD so it can never reach a mailbox.
      SMOKE_EMAIL: smoke-${{ github.run_id }}-${{ github.run_attempt }}@ci.invalid
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_IAM_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --region "$AWS_REGION" --name "$EKS_CLUSTER"

      - name: Apply manifests
        run: |
          set -euo pipefail
          if [ "$EXPOSE_PUBLIC" = "true" ]; then
            OVERLAY=k8s/overlays/public
          else
            OVERLAY=k8s/base
          fi
          echo "Deploying ${IMAGE_REF} from ${OVERLAY}"
          kubectl kustomize "$OVERLAY" \
            | sed "s|__IMAGE__|${IMAGE_REF}|g" \
            | kubectl apply -f -

      - name: Wait for database
        run: kubectl -n "$K8S_NAMESPACE" rollout status "statefulset/${DB_STATEFULSET}" --timeout=300s

      - name: Wait for rollout
        run: kubectl -n "$K8S_NAMESPACE" rollout status "deployment/${DEPLOYMENT}" --timeout=300s

      - name: Smoke test in cluster
        run: |
          set -euo pipefail
          POD=$(kubectl -n "$K8S_NAMESPACE" get pods \
            -l app.kubernetes.io/name=bmi-api \
            --field-selector status.phase=Running \
            -o jsonpath='{.items[0].metadata.name}')
          echo "Probing from pod ${POD}"
          # kubectl exec has no --env, so the address goes in as an argument.
          kubectl -n "$K8S_NAMESPACE" exec -i "$POD" -- python - "$SMOKE_EMAIL" <<'PY'
          import json
          import sys
          import urllib.error
          import urllib.parse
          import urllib.request
          from http.cookiejar import CookieJar

          BASE = "http://bmi-api.bmi-api.svc.cluster.local"
          EMAIL = sys.argv[1]
          PASSWORD = "smoke-test-password"

          health = json.load(urllib.request.urlopen("http://127.0.0.1:8080/health", timeout=10))
          assert health["status"] == "ok", health
          print("health ok on pod", health.get("pod"), "node", health.get("node"))

          # Anonymous visitors must be bounced to the sign-in page.
          anon = urllib.request.urlopen(BASE + "/", timeout=10)
          assert "Welcome back" in anon.read().decode(), "anonymous request was not redirected to /signin"
          try:
              urllib.request.urlopen(BASE + "/bmi?height_cm=175&weight_kg=70", timeout=10)
              raise AssertionError("/bmi answered without a session")
          except urllib.error.HTTPError as exc:
              assert exc.code == 401, exc.code
          print("unauthenticated access blocked")

          # One opener keeps the session cookie, like a real browser.
          browser = urllib.request.build_opener(urllib.request.HTTPCookieProcessor(CookieJar()))

          def post_form(path, fields):
              body = urllib.parse.urlencode(fields).encode()
              return browser.open(BASE + path, data=body, timeout=15)

          page = post_form("/signup", {
              "full_name": "CI Smoke Test",
              "email": EMAIL,
              "password": PASSWORD,
              "confirm_password": PASSWORD,
          }).read().decode()
          assert "Signed in as" in page and "CI Smoke Test" in page, "signup did not land on the app"
          print("signup wrote", EMAIL, "and started a session")

          browser.open(BASE + "/logout", data=b"", timeout=15)
          page = post_form("/signin", {"email": EMAIL, "password": PASSWORD}).read().decode()
          assert "BMI Health Check" in page, "signin did not reach the calculator"
          print("signin ok")

          # Several calls so the Service hits both replicas; they can only all
          # succeed if every pod signs cookies with the same shared secret.
          pods = set()
          for _ in range(6):
              request = urllib.request.Request(
                  BASE + "/bmi",
                  data=json.dumps({"height_cm": 175, "weight_kg": 70}).encode(),
                  headers={"Content-Type": "application/json"},
              )
              bmi = json.load(browser.open(request, timeout=15))
              assert bmi["bmi"] == 22.9 and bmi["category"] == "normal", bmi
              assert bmi["health_advice"] and bmi["exercises"], bmi
              pods.add(json.load(browser.open(BASE + "/health", timeout=10)).get("pod"))
          print("bmi ok across pods:", ", ".join(sorted(p or "?" for p in pods)))

          me = json.load(browser.open(BASE + "/me", timeout=10))
          assert me["email"] == EMAIL and me["last_login_at"], me
          print("session identity ok")
          print("Smoke tests passed")
          PY

      - name: Verify the row landed in Postgres
        run: |
          set -euo pipefail
          DB_POD="${DB_STATEFULSET}-0"
          ROW=$(kubectl -n "$K8S_NAMESPACE" exec -i "$DB_POD" -- sh -c \
            "psql -U \"\$POSTGRES_USER\" -d \"\$POSTGRES_DB\" -tAc \
             \"SELECT full_name FROM clients WHERE email = '${SMOKE_EMAIL}'\"")
          echo "clients row: ${ROW}"
          [ "$ROW" = "CI Smoke Test" ]
          # Remove the synthetic account so the table only holds real clients.
          kubectl -n "$K8S_NAMESPACE" exec -i "$DB_POD" -- sh -c \
            "psql -U \"\$POSTGRES_USER\" -d \"\$POSTGRES_DB\" -c \
             \"DELETE FROM clients WHERE email LIKE 'smoke-%@ci.invalid'\""

      - name: Wait for load balancer
        id: lb
        if: env.EXPOSE_PUBLIC == 'true'
        run: |
          set -euo pipefail
          for attempt in $(seq 1 40); do
            HOST=$(kubectl -n "$K8S_NAMESPACE" get svc "$DEPLOYMENT" \
              -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null || true)
            if [ -n "$HOST" ]; then
              echo "hostname=${HOST}" >> "$GITHUB_OUTPUT"
              echo "Load balancer: ${HOST}"
              break
            fi
            echo "waiting for load balancer (${attempt}/40)"
            sleep 15
          done
          if [ -z "${HOST:-}" ]; then
            echo "Load balancer did not get an address in time"
            exit 1
          fi
          # Targets take a couple of health check cycles to come into service.
          for attempt in $(seq 1 40); do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "http://${HOST}/health" || true)
            if [ "$CODE" = "200" ]; then
              echo "Public endpoint healthy after ${attempt} attempt(s)"
              exit 0
            fi
            echo "public endpoint not ready yet (http ${CODE}, ${attempt}/40)"
            sleep 15
          done
          echo "Public endpoint never returned 200"
          exit 1

      - name: Publish CloudWatch dashboard and alarms
        run: ./infra/apply-observability.sh

      - name: Deployment summary
        run: |
          {
            echo "### Deployed to EKS"
            echo ""
            echo "- Cluster: \`${EKS_CLUSTER}\` (${AWS_REGION})"
            echo "- Namespace: \`${K8S_NAMESPACE}\`"
            echo "- Image: \`${IMAGE_REF}\`"
            if [ -n "${{ steps.lb.outputs.hostname }}" ]; then
              echo "- Public UI: http://${{ steps.lb.outputs.hostname }}/"
            fi
            echo "- Dashboard: https://${AWS_REGION}.console.aws.amazon.com/cloudwatch/home?region=${AWS_REGION}#dashboards:name=${DASHBOARD_NAME}"
          } >> "$GITHUB_STEP_SUMMARY"
          kubectl -n "$K8S_NAMESPACE" get deploy,svc,pods -o wide

      - name: Notify Slack — deploy result
        if: always() && env.SLACK_WEBHOOK_URL != ''
        run: ./.github/scripts/slack-notify.sh "${{ job.status }}"
        env:
          APP_URL: ${{ steps.lb.outputs.hostname }}

      - name: Diagnostics on failure
        if: failure()
        run: |
          echo "::group::Pods"
          kubectl -n "$K8S_NAMESPACE" get pods -o wide || true
          echo "::endgroup::"
          echo "::group::Pod descriptions"
          kubectl -n "$K8S_NAMESPACE" describe pods || true
          echo "::endgroup::"
          echo "::group::Service"
          kubectl -n "$K8S_NAMESPACE" describe svc "$DEPLOYMENT" || true
          echo "::endgroup::"
          echo "::group::Recent events"
          kubectl -n "$K8S_NAMESPACE" get events --sort-by=.lastTimestamp | tail -40 || true
          echo "::endgroup::"
          echo "::group::Container logs"
          kubectl -n "$K8S_NAMESPACE" logs "deployment/${DEPLOYMENT}" --all-containers --tail=100 || true
          echo "::endgroup::"
          echo "::group::Database"
          kubectl -n "$K8S_NAMESPACE" describe "statefulset/${DB_STATEFULSET}" || true
          kubectl -n "$K8S_NAMESPACE" logs "statefulset/${DB_STATEFULSET}" --tail=80 || true
          echo "::endgroup::"
          # CI deliberately cannot read secrets, so a missing credentials
          # secret shows up as CreateContainerConfigError above.
          echo "If pods cannot start on bmi-db-credentials, re-run infra/bootstrap.sh."
